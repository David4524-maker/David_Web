<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David Web</title>
<style type="text/css">
html,body{margin:0;padding:0}
*{-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box}
body{background:#eef2f7;color:#14213d;font-family:"Trebuchet MS",Verdana,Arial,sans-serif;font-size:16px;line-height:1.55}
a{color:#0077b6}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.clear:after{content:"";display:table;clear:both}
.clear{zoom:1}

/* Barra superior */
#top{background:#14213d;color:#fff;padding:14px 0}
#top .logo{float:left;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:bold;color:#ffd166;text-decoration:none}
#top ul{float:right;margin:0;padding:0;list-style:none}
#top li{display:inline;margin-left:18px}
#top li a{color:#fff;text-decoration:none;font-size:15px;padding-bottom:3px;border-bottom:2px solid #14213d}
#top li a:hover{border-bottom-color:#ffd166}

/* Portada */
#hero{background:#14213d;background:-webkit-linear-gradient(top,#14213d,#1d3557);background:linear-gradient(to bottom,#14213d,#1d3557);color:#fff;padding:56px 0 64px}
#hero .left{float:left;width:56%;padding-right:24px}
#hero .right{float:right;width:44%}
#hero h1{font-family:Georgia,"Times New Roman",serif;font-size:68px;line-height:1.02;margin:0 0 18px;color:#fff}
#hero p.lead{font-size:19px;color:#cfe3f1;margin:0 0 26px;max-width:460px}
.btn{display:inline-block;background:#ffd166;color:#14213d;font-weight:bold;text-decoration:none;padding:12px 24px;border:0;cursor:pointer;font-size:16px;font-family:inherit;-webkit-border-radius:4px;border-radius:4px}
.btn:hover{background:#ffe29a}
.btn2{background:transparent;color:#fff;border:2px solid #fff;margin-left:8px;padding:10px 22px}
.btn2:hover{background:#fff;color:#14213d}

/* Panel de diagnostico */
#diag{background:#0b1429;border:2px solid #00b4d8;padding:20px;color:#e6f4fb;-webkit-border-radius:6px;border-radius:6px}
#diag h2{margin:0 0 4px;font-size:15px;font-weight:bold;color:#00b4d8;font-family:Georgia,serif}
#diag .clock{font-family:"Courier New",Courier,monospace;font-size:44px;color:#ffd166;margin:4px 0 12px}
#diag table{width:100%;border-collapse:collapse;font-size:14px}
#diag td{padding:6px 0;border-top:1px solid #24365f;vertical-align:top}
#diag td.k{color:#9fb9cc;width:40%}
.ok{color:#7bdc9a;font-weight:bold}
.no{color:#ff8a80;font-weight:bold}

/* Secciones */
.sec{padding:56px 0}
.sec h2{font-family:Georgia,"Times New Roman",serif;font-size:36px;margin:0 0 8px}
.sec p.sub{margin:0 0 30px;color:#4a5a78;max-width:560px}
.cols{margin:0 -10px}
.col{float:left;width:33.333%;padding:0 10px}
.card{background:#fff;border-top:6px solid #00b4d8;padding:22px 22px 18px;margin-bottom:20px;min-height:190px;-webkit-box-shadow:0 2px 0 #d3dce8;box-shadow:0 2px 0 #d3dce8}
.card.y{border-top-color:#ffd166}
.card.n{border-top-color:#14213d}
.card h3{font-family:Georgia,serif;font-size:21px;margin:0 0 8px}
.card p{margin:0;color:#34415c}

/* Juego */
#game{background:#fff;border-top:1px solid #d3dce8;border-bottom:1px solid #d3dce8}
#game .box{max-width:520px;background:#14213d;color:#fff;padding:26px;-webkit-border-radius:6px;border-radius:6px}
#game input{width:90px;padding:10px;font-size:20px;border:2px solid #00b4d8;background:#fff;color:#14213d;text-align:center;font-family:inherit;-webkit-border-radius:4px;border-radius:4px}
#msg{min-height:52px;margin:16px 0 4px;font-size:18px;color:#ffd166}
#info{font-size:14px;color:#9fb9cc}

/* Contacto */
.form label{display:block;font-weight:bold;margin:14px 0 4px}
.form input,.form textarea{width:100%;max-width:520px;padding:10px;font-size:16px;border:2px solid #b9c6d8;font-family:inherit;background:#fff;color:#14213d}
.form textarea{height:110px}
#fmsg{margin-top:14px;font-weight:bold}

#foot{background:#14213d;color:#9fb9cc;text-align:center;padding:26px 0;font-size:14px}
#foot b{color:#ffd166}

#top select{font-size:14px;padding:3px;background:#fff;color:#14213d;border:0}
.tab{background:#fff;color:#14213d;border:2px solid #14213d;padding:8px 16px;margin:0 6px 6px 0;font-size:15px;font-family:inherit;cursor:pointer;-webkit-border-radius:4px;border-radius:4px}
.tab.on{background:#14213d;color:#ffd166}
canvas{display:block;max-width:100%;height:auto;border:2px solid #00b4d8;background:#0b1429;-ms-touch-action:none;touch-action:none}
#cv-paint{background:#fff;border-color:#14213d;cursor:crosshair}
.hud{margin-top:12px;font-size:18px}
.hud b{color:#0077b6}
.swc{display:inline-block;width:26px;height:26px;margin:0 6px 6px 0;border:3px solid #fff;-webkit-box-shadow:0 0 0 1px #14213d;box-shadow:0 0 0 1px #14213d;cursor:pointer;vertical-align:middle}
.swc.on{border-color:#ffd166;-webkit-box-shadow:0 0 0 2px #14213d;box-shadow:0 0 0 2px #14213d}
#p-size{display:inline-block;min-width:30px;text-align:center;font-weight:bold}
.tools{margin-bottom:12px}
.mc{display:inline-block;width:64px;height:64px;margin:0 6px 6px 0;background:#14213d;border:2px solid #14213d;font:bold 30px/60px Arial,sans-serif;text-align:center;cursor:pointer;vertical-align:top;-webkit-border-radius:4px;border-radius:4px}
.mc.up{background:#fff}
#mem{width:290px;max-width:100%}
.news{background:#fff;border-left:6px solid #ffd166;padding:14px 20px;margin-bottom:16px;max-width:680px}
.news .dt{font-size:13px;color:#4a5a78}
.news h3{font-family:Georgia,serif;font-size:21px;margin:2px 0 6px}
.news p{margin:0 0 8px;color:#34415c}
@media (max-width:760px){
 #top .logo,#top ul{float:none;display:block;text-align:center}
 #top ul{margin-top:10px}
 #top li{margin:0 9px}
 #hero .left,#hero .right{float:none;width:100%;padding:0}
 #hero .right{margin-top:30px}
 #hero h1{font-size:50px}
 .col{float:none;width:100%}
 .card{min-height:0}
}
</style>
</head>
<body>

<div id="top"><div class="wrap clear">
 <a class="logo" href="#inicio">David Web</a>
 <ul>
  <li><a href="#juegos" data-t="nav_g">Juegos</a></li>
  <li><a href="#paint" data-t="nav_p">Paint</a></li>
  <li><a href="#noticias" data-t="nav_n">Noticias</a></li>
  <li><a href="#contacto" data-t="nav_c">Contacto</a></li>
  <li><select id="lang"><option>Español</option><option>English</option><option>Português</option><option>Français</option><option>Deutsch</option><option>Italiano</option><option>Русский</option><option>中文</option><option>日本語</option><option>한국어</option></select></li>
 </ul>
</div></div>

<div id="inicio"><div id="hero"><div class="wrap clear">
 <div class="left">
  <h1>David Web</h1>
  <p class="lead" data-t="lead"></p>
  <a class="btn" href="#juegos" data-t="play">Jugar</a><a class="btn btn2" href="#paint">Paint</a>
 </div>
 <div class="right">
  <div id="diag">
   <h2 data-t="diag_t"></h2>
   <div class="clock" id="clock">--:--:--</div>
   <table>
    <tr><td class="k">Browser</td><td id="d-nav">...</td></tr>
    <tr><td class="k">Screen</td><td id="d-scr">...</td></tr>
    <tr><td class="k">Canvas</td><td id="d-cv">...</td></tr>
   </table>
  </div>
 </div>
</div></div></div>

<div class="sec" id="juegos"><div class="wrap">
 <h2 data-t="nav_g">Juegos</h2>
 <p class="sub" data-t="hint"></p>
 <div class="tabs"><button class="tab on" id="t-snake" type="button">Snake</button><button class="tab" id="t-dash" type="button">Dash</button><button class="tab" id="t-pong" type="button">Pong</button><button class="tab" id="t-flap" type="button">Flappy</button><button class="tab" id="t-mem" type="button" data-t="g_mem">Memoria</button></div>
 <canvas id="cv-snake" width="320" height="320"></canvas>
 <canvas id="cv-dash" width="480" height="240" style="display:none"></canvas>
 <canvas id="cv-pong" width="480" height="300" style="display:none"></canvas>
 <canvas id="cv-flap" width="320" height="400" style="display:none"></canvas>
 <div id="mwrap" style="display:none"><div id="mem"></div><div id="mmsg" style="font-weight:bold;color:#1b7f43;margin-top:6px"></div></div>
 <div class="hud"><span data-t="score">Puntos</span>: <b id="score">0</b></div>
</div></div>

<div class="sec" id="paint" style="background:#fff;border-top:1px solid #d3dce8;border-bottom:1px solid #d3dce8"><div class="wrap">
 <h2>Paint</h2>
 <div class="tools">
  <span id="sw"></span><br>
  <button class="tab on" id="p-brush" type="button" data-t="brush">Pincel</button><button class="tab" id="p-erase" type="button" data-t="eraser">Borrador</button><button class="tab" id="p-minus" type="button">-</button><span id="p-size">6</span><button class="tab" id="p-plus" type="button" style="margin-left:6px">+</button><button class="tab" id="p-clear" type="button" data-t="clear">Limpiar</button>
 </div>
 <canvas id="cv-paint" width="560" height="320"></canvas>
</div></div>

<div class="sec" id="noticias"><div class="wrap">
 <h2><span data-t="nav_n">Noticias</span> 2026</h2>
 <p class="sub" id="news-note"></p>
 <div id="news"></div>
</div></div>

<div class="sec" id="contacto" style="background:#fff;border-top:1px solid #d3dce8"><div class="wrap">
 <h2 data-t="nav_c">Contacto</h2>
 <div class="form">
  <label for="f-name" data-t="c_name">Nombre</label><input type="text" id="f-name">
  <label for="f-mail" data-t="c_mail">Correo</label><input type="text" id="f-mail">
  <label for="f-txt" data-t="c_msg">Mensaje</label><textarea id="f-txt"></textarea>
  <div style="margin-top:16px"><button class="btn" id="send" type="button" style="background:#14213d;color:#ffd166" data-t="c_send">Enviar</button></div>
  <div id="fmsg"></div>
 </div>
</div></div>

<div id="foot"><b>David Web</b></div>
